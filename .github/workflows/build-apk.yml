name: Build APK

on:
  push:
    branches: [ccr-83d74c23-ipw6nf]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK and build tools
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;29.0.14206865" "build-tools;36.0.0" "platforms;android-36" "cmake;$(grep '^cmake ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')"

      - name: Cache prepared native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/jniLibs
          key: native-${{ hashFiles('tools/fetch-sherpa-onnx.sh', 'tools/bergamot/**', 'gradle/tools.versions.toml') }}

      - name: Fetch speech libraries (sherpa-onnx)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: tools/fetch-sherpa-onnx.sh

      - name: Build translation library (bergamot)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: tools/bergamot/build-android.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dictate-keyboard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
