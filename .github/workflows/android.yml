name: Android build

# Builds the phone and Wear apps and runs the unit tests on every push, so a change that does not
# compile is caught without anyone opening Android Studio. The debug APK is attached to each run:
# download it from the run's "Artifacts" section and install it on a phone to try the app.

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build stamps the git commit into the app
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same steps as the earlier "Build APK" workflow, which is known to work on the runner.
      - name: Install NDK and build tools
        run: |
          SDKM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;29.0.14206865" "build-tools;36.0.0" "platforms;android-36" "cmake;$(grep '^cmake ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')"

      # The on-device speech and translation libraries are not committed; they are fetched or built
      # once and cached.
      - name: Cache prepared native libraries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/src/main/jniLibs
          key: native-${{ hashFiles('tools/fetch-sherpa-onnx.sh', 'tools/bergamot/**', 'gradle/tools.versions.toml') }}

      - name: Fetch speech libraries (sherpa-onnx)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: tools/fetch-sherpa-onnx.sh

      - name: Build translation library (bergamot)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: tools/bergamot/build-android.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the phone and Wear apps
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :lib:dictate-core:testDebugUnitTest --no-daemon --stacktrace

      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
